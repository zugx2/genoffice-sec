# Local dev Keycloak for the GenOffice cloud-backend / OIDC work
# (see docs/cloud-backend-auth.md, Phase 0).
#
# Dev-only by design: plain HTTP, bootstrap admin credentials, and no
# persistent state — `docker compose down -v` wipes everything and the realm
# re-imports from realm/genoffice-realm.json on the next fresh boot.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: genoffice-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      # Dev-only bootstrap admin for the master realm (local debugging of the
      # imported realm). Never use credentials like this outside local dev.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pin the advertised issuer to the dev anchor the desktop app expects
      # (docs/cloud-backend-auth.md: http://localhost:8080/realms/genoffice),
      # so advertised endpoints/tokens never drift with the Host header used.
      KC_HOSTNAME: http://localhost:8080
    ports:
      # Dev config anchor (Phase 2 depends on this): Keycloak MUST be
      # reachable on host port 8080.
      - '8080:8080'
    volumes:
      # Realm import (declarative; skipped automatically if the realm exists).
      - ./realm:/opt/keycloak/data/import:ro

  # GenOffice cloud backend (Phase 4, services/backend). Profile-gated so a
  # plain `up` stays Keycloak-only; bring it up with
  # `docker compose --profile backend up -d --build`.
  backend:
    build:
      # Repo root as context so the Dockerfile can copy tsconfig.base.json;
      # the root .dockerignore keeps the context to this service's files.
      context: ../..
      dockerfile: services/backend/Dockerfile
    profiles: ['backend']
    environment:
      GENOFFICE_BACKEND_PORT: '8000'
      # Listen on all interfaces inside the container (published below).
      GENOFFICE_BACKEND_HOST: '0.0.0.0'
      # The iss claim check keeps the host-anchored issuer Keycloak
      # advertises (KC_HOSTNAME above), but the JWKS is fetched over the
      # compose network — that is the GENOFFICE_BACKEND_JWKS_URL override
      # case (services/backend/README.md, "Docker networking").
      GENOFFICE_BACKEND_ISSUER: 'http://localhost:8080/realms/genoffice'
      GENOFFICE_BACKEND_JWKS_URL: 'http://keycloak:8080/realms/genoffice/protocol/openid-connect/certs'
    ports:
      # Dev config anchor: the shell's DEV_BACKEND_URL expects port 8000.
      - '8000:8000'
    depends_on:
      - keycloak
